name: CI

on:
  # A branch with an open pull request would otherwise be built twice for the
  # same commit — once by `push`, once by `pull_request`. Pushes are therefore
  # narrowed to the branch CD chains off; every other branch is covered by its
  # pull request.
  push:
    branches: [master]
  pull_request:

# Superseded runs on the same ref are pointless — except on master, where CD
# picks up the completed run and cancelling one would drop the deploy with it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # The three gates, in the same order and with the same commands as the
  # Makefile: code style, static analysis, tests. Keep them in sync — they must
  # stay runnable both ways.
  checks:
    name: cs-check · typecheck · tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # What ships is what has to be clean: anything high or critical in a
      # runtime dependency fails the build.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # Build-time tooling is reported but does not block. A parser that only
      # ever reads a file we vendored from our own API is a different risk from
      # code served to a browser, and a transitive advisory with no upstream fix
      # would otherwise wedge every unrelated pull request.
      - name: Audit build tooling (advisory)
        run: npm audit --audit-level=high || true

      # --- static gates first: fast feedback, nothing to boot ---
      - name: Code style (Prettier · ESLint · Stylelint)
        run: npm run cs-check

      # The contract suite checks the client against a *committed* copy of the
      # API's spec, so that copy and its generated types have to agree. A yaml
      # refreshed without regenerating — or a schema.d.ts touched by hand —
      # would otherwise make every downstream assertion answer the wrong
      # document, and quietly pass.
      - name: Generated types match the vendored spec
        run: npm run spec:verify

      - name: Static analysis (TypeScript)
        run: npm run typecheck

      # `typecheck` is not a build: it runs tsc in check-only mode and never
      # asks Vite to resolve an import, an alias or an asset. Without this step
      # a broken bundle is only caught by CD — after the merge to master.
      - name: Build the bundle
        run: npm run build

      # A bundle regression is invisible in a diff — it arrives as one more
      # import in a file that looks harmless.
      - name: Bundle budget
        run: npm run size

      # --- tests: unit + functional, answered by MSW, no API needed ---
      - name: Run tests
        run: npm run test -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # The end-to-end suite drives a real browser against a *running* API, which
  # this repository does not contain — so it only runs where one is reachable.
  # Set the `E2E_API_URL` repository variable to enable it; locally it is
  # `make test-e2e` against the Docker stack.
  e2e:
    name: end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: checks
    if: vars.E2E_API_URL != ''

    env:
      VITE_API_BASE_URL: ${{ vars.E2E_API_URL }}
      E2E_BASE_URL: http://localhost:4173

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build the client
        run: npm run build

      - name: Serve the build and run the suite
        run: |
          npx vite preview --port 4173 --strictPort &
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:4173 && break
            sleep 2
          done
          npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
