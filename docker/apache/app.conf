ServerName localhost
ServerTokens Prod
ServerSignature Off

DocumentRoot "/usr/local/apache2/htdocs"

<Directory "/usr/local/apache2/htdocs">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    # SPA history fallback: any unknown path serves the shell so React Router
    # can resolve the route on the client.
    FallbackResource /index.html

    # ...but not for source maps. The Dockerfile deletes them from the document
    # root, and without this the fallback would answer every `.map` request with
    # the shell and a 200 — telling a probe "something is here" about a file
    # deliberately removed. A plain 404 is both the truth and the smaller hint.
    <FilesMatch "\.map$">
        FallbackResource disabled
    </FilesMatch>
</Directory>

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml \
                                  text/javascript application/javascript \
                                  application/json image/svg+xml
</IfModule>

<IfModule mod_expires.c>
    ExpiresActive On

    # Vite fingerprints every asset (including sourcemaps), so they may be
    # cached indefinitely — a changed file always gets a new hashed filename.
    <FilesMatch "\.(js|mjs|css|map|woff2?|png|jpe?g|webp|gif|svg|avif|ico)$">
        ExpiresDefault "access plus 1 year"
    </FilesMatch>

    # The shell and the runtime config must never be cached — env.js is
    # rewritten on every container start.
    <FilesMatch "^(index\.html|env\.js)$">
        ExpiresDefault "access plus 0 seconds"
        Header set Cache-Control "no-store, must-revalidate"
    </FilesMatch>
</IfModule>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# Every fingerprinted build asset lives under assets/ — env.js and index.html
# never do. Scoping this by directory rather than by extension rules out any
# collision with the no-store block above (env.js also ends in ".js", so an
# extension-only match would win on filename and race the no-store rule).
<Directory "/usr/local/apache2/htdocs/assets">
    <IfModule mod_headers.c>
        # Belt-and-suspenders on top of mod_expires above: skip revalidation
        # entirely, since the filename itself guarantees the content behind
        # it never changes.
        Header set Cache-Control "public, max-age=31536000, immutable"
    </IfModule>
</Directory>
